name: Static analysis

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the clang-format major version used locally.
      CLANG_FORMAT_VERSION: "22.1.8"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
          clang-format --version

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.ipp' '*.inl')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C/C++ files to check."
            exit 0
          fi
          printf 'Checking %d file(s)\n' "${#files[@]}"
          clang-format --style=file --dry-run --Werror "${files[@]}"
